<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Krazy Konfigs | Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body id="body">
    <div class="bg-fx"></div>
    <div id="smooth-cursor"></div>

    <div data-include="/components/modals.html"></div>
    <div data-include="/components/navbar.html"></div>

    <div data-include="/components/dashboard/hero.html"></div>
    <div data-include="/components/dashboard/configs-grid.html"></div>
    <div data-include="/components/dashboard/contributors-grid.html"></div>

    <div data-include="/components/music-player.html"></div>

    <script src="/assets/js/core.js"></script>
    <script src="/assets/js/music.js"></script>
    <script src="/assets/js/dashboard.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Wait for ALL HTML components to finish downloading
            injectComponents().then(() => {
                // NOW trigger the dashboard logic
                if(typeof initDashboardLogic === 'function') initDashboardLogic();

                // Background Security checks
                setInterval(async()=>{
                    if(!currentUser) return;
                    try{
                        const{data:t}=await _supabase.from('settings').select('maintenance_mode').eq('id',1).single(),
                             {data:e}=await _supabase.from('users').select('isBlacklisted, rank').eq('id',currentUser.id).single();
                        if(e?.isBlacklisted==='true'||(t?.maintenance_mode===true && e?.rank!=='admin')) window.location.href='maintenance.html';
                    } catch(e){}
                }, 30000);

                _supabase.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_OUT') window.location.href = 'login.html';
                });
            });
        });
    </script>
</body>
</html>
