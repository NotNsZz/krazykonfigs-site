<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Krazy Konfigs | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--bg-body:#fff;--bg-nav:rgba(255,255,255,.95);--bg-card:#fff;--text-main:#000;--text-muted:#666;--border:#eee;--tag-bg:#f0f0f0;--transition:all .3s cubic-bezier(.4,0,.2,1);--glow-color:rgba(0,0,0,.15);--card-inner:#f9f9f9;--modal-bg:#fff;--modal-border:#eee;--accent:#5865F2;--danger:#ed4245}
        body.dark-mode{--bg-body:#0a0a0a;--bg-nav:rgba(10,10,10,.95);--bg-card:#121212;--text-main:#fff;--text-muted:#aaa;--border:#1f1f1f;--tag-bg:#1a1a1a;--glow-color:rgba(255,255,255,.15);--card-inner:#151515;--modal-bg:#161616;--modal-border:#1f1f1f}
        body{background-color:var(--bg-body);color:var(--text-main);font-family:'Source Sans Pro',sans-serif;transition:background-color .3s;opacity:0;overflow-x:hidden;background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:24px 24px}
        body.ready{opacity:1;transition:opacity .5s ease}
        .bg-fx{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:-1;overflow:hidden;transition:opacity .5s ease}
        body.ambient-off .bg-fx{opacity:0}
        .bg-fx::after,.bg-fx::before{content:'';position:absolute;border-radius:50%;filter:blur(150px);animation:floatBg 25s infinite alternate ease-in-out}
        .bg-fx::before{width:60vw;height:60vw;background:var(--text-main);opacity:.03;top:-20vh;left:-10vw}
        .bg-fx::after{width:50vw;height:50vw;background:var(--text-main);opacity:.02;bottom:-10vh;right:-5vw;animation-delay:-12s}
        @keyframes floatBg{0%{transform:translate(0,0) scale(1)}100%{transform:translate(5vw,5vh) scale(1.1)}}
        #smooth-cursor{position:fixed;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 15px rgba(255,255,255,.5);pointer-events:none;z-index:10000;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s}
        body:not(.dark-mode) #smooth-cursor{background:rgba(0,0,0,.15);box-shadow:0 0 15px rgba(0,0,0,.15)}
        ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:0 0}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:10px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.8)}
        *{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent;margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth}
        body:not(.dark-mode) ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2)}body:not(.dark-mode) ::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.5)}body:not(.dark-mode) *{scrollbar-color:rgba(0,0,0,.2) transparent}
        .hero{height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 5%;margin-top:60px}
        .hero h1{font-size:clamp(2.5rem,6vw,4rem);font-weight:900;margin-bottom:1rem;letter-spacing:-1.5px;text-transform:uppercase}
        .hero p{color:var(--text-muted);font-size:1.1rem;max-width:600px;margin-bottom:2.5rem}
        .hero-btn{padding:16px 40px;border-radius:4px;background:var(--text-main);color:var(--bg-body);font-size:1rem;font-weight:800;cursor:pointer;text-decoration:none;transition:var(--transition);border:2px solid var(--text-main);text-transform:uppercase}
        .hero-btn:hover{background:0 0;color:var(--text-main)}
        .section-padding{padding:4rem 10%}
        .config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:2rem}
        .config-card{background:var(--card-inner);border:1px solid var(--border);border-radius:8px;padding:2rem;transition:var(--transition);display:flex;flex-direction:column;justify-content:space-between;position:relative}
        .card-head{margin-bottom:1rem;display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.2rem;text-transform:uppercase;letter-spacing:.5px}
        .card-divider{height:2px;width:100%;background:var(--border);margin-bottom:1.5rem}
        .section-label{font-size:.8rem;font-weight:800;color:var(--text-main);margin-bottom:.8rem;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:1px}
        .data-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.9rem;font-weight:600}
        .data-val{font-weight:800;color:var(--text-main)}
        .card-footer-box{margin-top:1.5rem;display:flex;justify-content:space-between;align-items:flex-end}
        .revert-badge{background:var(--bg-card);color:var(--text-main);border:1px solid var(--border);padding:6px 12px;font-weight:900;font-size:.75rem;border-radius:4px;display:inline-block;box-shadow:0 4px 6px rgba(0,0,0,.05)}
        .review-trigger-btn{margin-top:1.5rem;width:100%;padding:12px;border-radius:4px;background:0 0;border:1px solid var(--text-main);color:var(--text-main);font-weight:700;cursor:pointer;transition:var(--transition);display:flex;justify-content:center;align-items:center;gap:8px;font-family:inherit}
        .review-trigger-btn:hover{background:var(--text-main);color:var(--bg-body)}
        .filter-btn{padding:8px 20px;border-radius:4px;border:1px solid var(--border);background:var(--card-inner);color:var(--text-main);font-size:.85rem;font-weight:700;cursor:pointer;transition:var(--transition);text-transform:uppercase}
        .filter-btn.active{background:var(--text-main);color:var(--bg-body);border-color:var(--text-main)}
        .member-card{background:var(--card-inner);border:1px solid var(--border);padding:1.5rem;border-radius:8px;display:flex;flex-direction:column;gap:1rem;transition:var(--transition)}
        .member-header{display:flex;align-items:center;gap:12px}
        .badge-tag{font-size:.65rem;padding:4px 10px;border-radius:20px;font-weight:800;text-transform:uppercase;background:0 0;border:1px solid currentColor;letter-spacing:.5px}
        body.dark-mode .badge-tag{filter:saturate(1.2) brightness(1.2)}
        body:not(.dark-mode) .badge-tag{filter:saturate(.9) brightness(.7)}
        .form-input{width:100%;padding:12px;border:1px solid var(--border);background:var(--bg-body);color:var(--text-main);border-radius:4px;font-family:inherit;font-weight:600;outline:0;transition:border-color .3s}
        .form-input:focus{border-color:var(--text-main)}
    </style>
</head>
<body id="body">
    <div class="bg-fx"></div>
    <div id="smooth-cursor"></div>

    <div data-include="/components/modals.html"></div>
    <div data-include="/components/navbar.html"></div>

    <section class="hero" id="about">
        <h1>Krazy Konfigs</h1>
        <p>Precision-engineered simulation presets mapped directly to your exact connection type.</p>
        <a href="#configs" class="hero-btn">View Configs</a>
    </section>

    <section class="section-padding" id="configs">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem;flex-wrap:wrap;gap:1rem">
            <h2 style="font-weight:900;font-size:2rem;letter-spacing:-1px">CONFIGS</h2>
            <div style="display:flex;gap:.8rem;flex-wrap:wrap;align-items:center">
                <input type="text" id="configSearch" class="form-input" style="margin:0;width:220px;padding:8px 16px;min-height:38px" placeholder="Search configs..." oninput="applyFilters()"> 
                <select id="creatorFilter" class="form-input" style="margin:0;width:auto;padding:8px 16px;min-height:38px" onchange="applyFilters()">
                    <option value="all">By Creator</option>
                </select> 
                <button class="filter-btn active" onclick="applyFilters('all',this)">All</button> 
                <button class="filter-btn" onclick="applyFilters('low',this)">Low Ping</button> 
                <button class="filter-btn" onclick="applyFilters('mid',this)">Mid Ping</button> 
                <button class="filter-btn" onclick="applyFilters('high',this)">High Ping</button>
            </div>
        </div>
        <div class="config-grid" id="config-container"></div>
        <div id="showMoreConfigsBtnWrap" style="text-align:center;margin-top:2.5rem;display:none">
            <button class="hero-btn" style="width:100%;max-width:800px;padding:18px;letter-spacing:2px" onclick="showMoreConfigs()">SHOW MORE CONFIGS <i class="fas fa-chevron-down" style="margin-left:10px"></i></button>
        </div>
    </section>

    <section class="section-padding" id="contributors" style="background:var(--tag-bg)">
        <h2 style="font-weight:900;font-size:2rem;letter-spacing:-1px;margin-bottom:2.5rem">CONTRIBUTORS</h2>
        <div id="contributor-container" class="config-grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))"></div>
    </section>

    <div data-include="/components/music-player.html"></div>

    <script>
        // --- INJECTOR SCRIPT ---
        async function loadComponents() {
            const elements = document.querySelectorAll('[data-include]');
            for (let el of elements) {
                const file = el.getAttribute('data-include');
                try {
                    const response = await fetch(file);
                    if (response.ok) el.innerHTML = await response.text();
                } catch (e) { console.error('Failed to load', file); }
            }
        }

        // --- INITIALIZE APP AFTER COMPONENTS LOAD ---
        document.addEventListener("DOMContentLoaded", () => {
            loadComponents().then(() => {
                bootSequence();
                animateCursor();
                setInterval(initCursorHovers, 2000);
                setInterval(async()=>{
                    if(!currentUser) return;
                    try{
                        const{data:t}=await _supabase.from('settings').select('maintenance_mode').eq('id',1).single(),
                             {data:e}=await _supabase.from('users').select('isBlacklisted, rank').eq('id',currentUser.id).single();
                        if(e?.isBlacklisted==='true'||(t?.maintenance_mode===!0&&e?.rank!=='admin')) window.location.href='maintenance.html';
                    } catch(t){}
                }, 3e4);
            });
        });

        const _supabase=supabase.createClient('https://unjdjduiqtldgoybgmnq.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuamRqZHVpcXRsZGdveWJnbW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MzgzODEsImV4cCI6MjA5MzAxNDM4MX0.qMuQcBysiKuFD5ByoL17fs0KxClgI-FEyzyKYayNVdE');
        let allConfigs=[],currentFilteredConfigs=[],currentVisibleCount=9,currentPingTier='all',currentUser=null,activeConfigId=null,currentRatingInput=5,replyingToId=null;
        
        function escapeHTML(t){if(t===null||t===undefined)return'';return t.toString().replace(/[&<>'"]/g,e=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[e]||e))}
        
        const cursor=document.getElementById('smooth-cursor');
        let curX=window.innerWidth/2,curY=window.innerHeight/2,tgX=curX,tgY=curY;
        let dragEco=null,musicPlayer=null,ecoResizer=null;
        let isDraggingEco=!1,isResizingEco=!1,ecoX=0,ecoY=0,tgEcoX=0,tgEcoY=0,ecoScale=1,tgEcoScale=1,startScale=1,ecoStartX=0,ecoStartY=0,mouseStartX=0,mouseStartY=0;

        function bindPlayerDrag() {
            dragEco=document.getElementById('music-ecosystem');musicPlayer=document.getElementById('music-player');ecoResizer=document.getElementById('eco-resizer');
            if(ecoResizer){ecoResizer.addEventListener('mousedown',e=>{e.stopPropagation();isResizingEco=!0;mouseStartX=e.clientX;mouseStartY=e.clientY;startScale=tgEcoScale;document.body.style.cursor='nwse-resize';document.body.style.userSelect='none'})}
            if(musicPlayer){musicPlayer.style.cursor='grab';musicPlayer.addEventListener('mousedown',e=>{if(e.target.closest('button')||e.target.closest('.progress-container')||e.target.tagName.toLowerCase()==='img'||e.target.closest('.eco-resizer'))return;isDraggingEco=!0;mouseStartX=e.clientX;mouseStartY=e.clientY;ecoStartX=tgEcoX;ecoStartY=tgEcoY;musicPlayer.style.cursor='grabbing';document.body.style.userSelect='none'})}
        }

        window.addEventListener('mousemove',e=>{tgX=e.clientX;tgY=e.clientY;if(isDraggingEco){tgEcoX=ecoStartX+(e.clientX-mouseStartX);tgEcoY=ecoStartY+(e.clientY-mouseStartY)}if(isResizingEco){const dx=mouseStartX-e.clientX;const dy=mouseStartY-e.clientY;const delta=dx+dy;tgEcoScale=Math.max(0.5,Math.min(2.5,startScale+(delta*.003)))}});
        window.addEventListener('mouseup',()=>{if(isDraggingEco){isDraggingEco=!1;if(musicPlayer)musicPlayer.style.cursor='grab';document.body.style.userSelect=''}if(isResizingEco){isResizingEco=!1;document.body.style.cursor='';document.body.style.userSelect=''}});
        
        function animateCursor(){curX+=(tgX-curX)*.15;curY+=(tgY-curY)*.15;cursor.style.left=curX+'px';cursor.style.top=curY+'px';ecoX+=(tgEcoX-ecoX)*.15;ecoY+=(tgEcoY-ecoY)*.15;ecoScale+=(tgEcoScale-ecoScale)*.15;if(dragEco)dragEco.style.transform=`translate(${ecoX}px, ${ecoY}px) scale(${ecoScale})`;requestAnimationFrame(animateCursor)}
        
        function initCursorHovers(){document.querySelectorAll('a, button, .lib-item, .item-card, .profile-trigger, .nav-btn, .config-card, .review-trigger-btn, .input-star, .lib-close, .control-btn, .util-btn, .dropdown-item').forEach(e=>{e.addEventListener('mouseenter',()=>cursor.style.transform='translate(-50%, -50%) scale(1.5)');e.addEventListener('mouseleave',()=>cursor.style.transform='translate(-50%, -50%) scale(1)')})}
        
        function customAlert(t,e="Notice"){return new Promise(n=>{const i=document.getElementById('customDialogOverlay');document.getElementById('dialogTitle').innerText=e;document.getElementById('dialogMessage').innerText=t;document.getElementById('dialogBtnCancel').style.display='none';const c=document.getElementById('dialogBtnConfirm');c.innerText='OK';c.className='btn-modal-primary';const o=document.getElementById('dialogCloseX');const r=()=>{i.classList.remove('show');c.removeEventListener('click',r);o.removeEventListener('click',r);n(!0)};c.addEventListener('click',r);o.addEventListener('click',r);i.classList.add('show')})}
        function customConfirm(t,e="Confirm Action",n="Confirm",i=!1){return new Promise(c=>{const o=document.getElementById('customDialogOverlay');document.getElementById('dialogTitle').innerText=e;document.getElementById('dialogMessage').innerText=t;const r=document.getElementById('dialogBtnCancel'),a=document.getElementById('dialogBtnConfirm'),l=document.getElementById('dialogCloseX');r.style.display='block';a.innerText=n;a.className=i?'btn-modal-danger':'btn-modal-primary';const u=()=>{o.classList.remove('show');r.removeEventListener('click',s);a.removeEventListener('click',d);l.removeEventListener('click',s)},s=()=>{u();c(!1)},d=()=>{u();c(!0)};r.addEventListener('click',s);a.addEventListener('click',d);l.addEventListener('click',s);o.classList.add('show')})}
        function closeCreatorPromo(){document.getElementById('creatorPromoOverlay').classList.remove('show')}
        function toggleUserDropdown(t){t.stopPropagation();document.getElementById('userDropdown').classList.toggle('show')}
        window.onclick=()=> { const dd = document.getElementById('userDropdown'); if(dd) dd.classList.remove('show'); };
        function toggleAmbient(){const t=document.body.classList.toggle('ambient-off');localStorage.setItem('ambient',t?'off':'on');document.getElementById('ambientStateText').innerText=t?'OFF':'ON'}

        async function bootSequence(){
            try {
                const {data:t} = await _supabase.from('settings').select('maintenance_mode').eq('id',1).single(),
                      e = t?.maintenance_mode === true,
                      {data:{session:n}} = await _supabase.auth.getSession();
                      
                if(!n){
                    if(e) return window.location.href='maintenance.html';
                    document.body.classList.add('ready');
                    return initDashboard();
                }
                
                const i=n.user, c=i.user_metadata, o=c.provider_id||i.id;
                const {data:r} = await _supabase.from('users').select('rank, isBlacklisted').eq('id',i.id).single();
                
                if(r?.isBlacklisted === 'true'){
                    await _supabase.auth.signOut();
                    return window.location.href='maintenance.html';
                }
                if(e && r?.rank !== 'admin') return window.location.href='maintenance.html';
                
                const dName = c.custom_claims?.global_name || c.full_name || c.name || 'User';
                const uName = c.preferred_username || c.name || 'user';

                currentUser = {
                    id: i.id, discord_id: o, 
                    username: uName, display_name: dName, 
                    avatar_url: c.avatar_url, rank: r?.rank||'user'
                };
                
                await _supabase.from('users').upsert({
                    id: currentUser.id, discord_id: currentUser.discord_id, 
                    username: currentUser.username, display_name: currentUser.display_name, 
                    avatar_url: currentUser.avatar_url, last_login: new Date().toISOString()
                });

                document.getElementById('navName').innerText = escapeHTML(currentUser.display_name);
                document.getElementById('navPfp').src = escapeHTML(currentUser.avatar_url) || 'https://via.placeholder.com/32';
                if(currentUser.rank.toLowerCase() === "admin") {
                    const adminBtn = document.getElementById('adminPanelOption');
                    if(adminBtn) adminBtn.style.display='flex';
                }
                
                document.body.classList.add('ready');
                initDashboard();
            } catch(t) {
                document.body.classList.add('ready');
                initDashboard();
            }
        }

        _supabase.auth.onAuthStateChange((t,e)=>{if(t==='SIGNED_OUT')window.location.href='login.html'});

        async function initDashboard(){
            bindPlayerDrag();
            if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark-mode');document.getElementById('themeBtn').innerHTML='<i class="fas fa-sun"></i>'}
            if(localStorage.getItem('ambient')==='off'){document.body.classList.add('ambient-off');if(document.getElementById('ambientStateText'))document.getElementById('ambientStateText').innerText='OFF'}
            if(!sessionStorage.getItem('creatorPromoSeen')){sessionStorage.setItem('creatorPromoSeen','true');document.getElementById('creatorPromoOverlay').classList.add('show')}
            fetchConfigs();
            fetchContributors();
            initMusicPlayer();
        }

        let playlist=[],currentTrackIndex=0,isPlaying=!1;let audioEngine=null;
        function formatTime(t){if(isNaN(t))return"0:00";const e=Math.floor(t/60),n=Math.floor(t%60);return`${e}:${n<10?'0':''}${n}`}
        function extractCategoryFromSrc(t){if(!t)return"Unknown";const e=t.match(/\/assets\/music\/([^\/]+)\//);let n=e?e[1]:"Unknown";n=decodeURIComponent(n);if(n.toLowerCase()==='gta')return'Grand Theft Auto';return n.charAt(0).toUpperCase()+n.slice(1)}
        
        async function fetchMusicManifest(){
            try{const t=await fetch('/assets/music/music-manifest.json?v='+new Date().getTime()),e=await t.json();playlist=e.map((t,e)=>(t.originalIndex=e,t.category=extractCategoryFromSrc(t.src),t));if(playlist&&playlist.length>0){loadTrack(0);populateLibraryCategories();buildLibraryUI(playlist)}else document.getElementById('player-title').innerText="No Tracks Found"}
            catch(t){console.error("Manifest Load Error:",t);document.getElementById('player-title').innerText="Load Error"}
        }
        
        function initMusicPlayer(){
            audioEngine=document.getElementById('global-audio');
            fetchMusicManifest();
            audioEngine.addEventListener('timeupdate',()=>{if(audioEngine.duration){document.getElementById('progress-bar').style.width=`${audioEngine.currentTime/audioEngine.duration*100}%`;document.getElementById('current-time').innerText=formatTime(audioEngine.currentTime)}});
            audioEngine.addEventListener('loadedmetadata',()=>{document.getElementById('duration-time').innerText=formatTime(audioEngine.duration)});
            audioEngine.addEventListener('ended',nextTrack)
        }
        
        function loadTrack(t){currentTrackIndex=t;const e=playlist[t],n=e.src,i=e.cover||'/assets/images/logo.png';audioEngine.src=n;document.getElementById('player-category').innerText=escapeHTML(e.category);document.getElementById('player-title').innerText=escapeHTML(e.title);document.getElementById('vinyl-spin').src=i;updateLibraryHighlight()}
        function togglePlay(){const t=document.getElementById('play-btn'),e=document.getElementById('vinyl-spin');if(isPlaying){audioEngine.pause();t.innerHTML='<i class="fas fa-circle-play"></i>';e.classList.remove('playing');isPlaying=!1}else{audioEngine.play().then(()=>{t.innerHTML='<i class="fas fa-circle-pause"></i>';e.classList.add('playing');isPlaying=!0}).catch(n=>{console.warn(n);isPlaying=!1;t.innerHTML='<i class="fas fa-circle-play"></i>';e.classList.remove('playing')})}}
        function nextTrack(){currentTrackIndex=(currentTrackIndex+1)%playlist.length;loadTrack(currentTrackIndex);if(isPlaying)audioEngine.play().catch(e=>console.warn(e))}
        function prevTrack(){currentTrackIndex=(currentTrackIndex-1+playlist.length)%playlist.length;loadTrack(currentTrackIndex);if(isPlaying)audioEngine.play().catch(e=>console.warn(e))}
        function seekAudio(t){const e=document.getElementById('progress-bar-container').getBoundingClientRect();audioEngine.currentTime=(t.clientX-e.left)/e.width*audioEngine.duration}
        function togglePlayerSize(){const t=document.getElementById('music-player'),e=document.getElementById('resize-btn');if(t.classList.contains('maximized')){t.classList.replace('maximized','minimized');e.innerHTML='<i class="fas fa-expand-arrows-alt"></i>';e.title="Maximize";if(document.getElementById('music-ecosystem').classList.contains('ecosystem-active'))toggleLibrary()}else{t.classList.replace('minimized','maximized');e.innerHTML='<i class="fas fa-compress-alt"></i>';e.title="Minimize"}}
        function toggleLibrary(){const t=document.getElementById('music-ecosystem'),e=document.getElementById('music-player');if(!t.classList.contains('ecosystem-active')&&e.classList.contains('minimized'))togglePlayerSize();t.classList.toggle('ecosystem-active')}
        function populateLibraryCategories(){const t=[...new Set(playlist.map(t=>t.category))],e=document.getElementById('libCategory');e.innerHTML='<option value="all">All Categories</option>'+t.map(t=>`<option value="${escapeHTML(t)}">${escapeHTML(t)}</option>`).join('')}
        function filterLibrary(){const t=document.getElementById('libSearch').value.toLowerCase(),e=document.getElementById('libCategory').value,n=playlist.filter(n=>{return n.title.toLowerCase().includes(t)&&(e==='all'||n.category===e)});buildLibraryUI(n)}
        function buildLibraryUI(t){const e=document.getElementById('library-list');if(t.length===0)return e.innerHTML='<p style="text-align:center; padding: 2rem 0; color:var(--text-muted); font-size:0.85rem;">No tracks found.</p>';e.innerHTML=t.map(t=>{const e=t.cover||'/assets/images/logo.png';return`<div class="lib-item" id="lib-track-${t.originalIndex}" onclick="playFromLibrary(${t.originalIndex})"><img src="${e}" class="lib-item-cover" alt="Cover" onerror="this.src='./assets/images/logo.png'"><div class="lib-item-info"><h4>${escapeHTML(t.title)}</h4><span>${escapeHTML(t.category)}</span></div></div>`}).join('');updateLibraryHighlight()}
        function playFromLibrary(t){if(t!==currentTrackIndex){loadTrack(t);if(isPlaying)audioEngine.play().catch(e=>console.warn(e));else togglePlay()}else togglePlay()}
        function updateLibraryHighlight(){document.querySelectorAll('.lib-item').forEach(t=>t.classList.remove('active'));const t=document.getElementById(`lib-track-${currentTrackIndex}`);if(t)t.classList.add('active')}

        async function fetchConfigs(){const{data:t}=await _supabase.from('configs').select('*').eq('is_archived','false');allConfigs=(t||[]).sort((t,e)=>(parseInt(t.priority)||999)-(parseInt(e.priority)||999));const e=[...new Set(allConfigs.map(t=>t.creator).filter(Boolean))],n=document.getElementById('creatorFilter');if(n){n.innerHTML='<option value="all">By Creator</option>'+e.map(t=>`<option value="${escapeHTML(t)}">${escapeHTML(t)}</option>`).join('')}applyFilters(null,document.querySelector('.filter-btn.active'))}
        function applyFilters(t=null,e=null){if(t){currentPingTier=t;if(e){document.querySelectorAll('#configs .filter-btn').forEach(t=>t.classList.remove('active'));e.classList.add('active')}}currentVisibleCount=9;const n=(document.getElementById('configSearch')?.value||'').toLowerCase(),i=document.getElementById('creatorFilter')?.value||'all';currentFilteredConfigs=allConfigs.filter(t=>((currentPingTier==='all'||(t.ping_tier||'').toLowerCase().includes(currentPingTier))&&(t.title||'').toLowerCase().includes(n)&&(i==='all'||t.creator===i)));renderConfigs()}
        function showMoreConfigs(){currentVisibleCount+=9;renderConfigs()}
        
        // --- RENDER CONFIGS (UPDATED WITH PROFILE LINK) ---
        function renderConfigs(){
            const t=document.getElementById('config-container'),e=document.getElementById('showMoreConfigsBtnWrap'),n=currentFilteredConfigs.slice(0,currentVisibleCount);
            t.innerHTML=n.map(t=>`<div class="config-card"><div><div class="card-head">${escapeHTML(t.title)} | ${escapeHTML(t.ping_tier)||'N/A'} PING</div><div class="card-divider"></div><div style="margin-bottom: 1.2rem;"><div class="section-label">🎯 PREDICTION</div><div class="data-row"><span style="color:var(--text-muted)">Simulation Timer</span> <span class="data-val">${escapeHTML(t.sim_timer)??'-'}</span></div><div class="data-row"><span style="color:var(--text-muted)">Prediction Interval</span> <span class="data-val">${escapeHTML(t.pred_interval)||'-'}</span></div></div><div style="margin-bottom: 1.2rem;"><div class="section-label"><i class="fas fa-cog" style="color:#a6aeb9;"></i> TOGGLES</div><div class="data-row"><span style="color:var(--text-muted)">Prioritize Ping</span> <span class="data-val">ON</span></div><div class="data-row"><span style="color:var(--text-muted)">Predict Jump</span> <span class="data-val">ON</span></div><div class="data-row"><span style="color:var(--text-muted)">Predict Lag</span> <span class="data-val">ON</span></div><div class="data-row"><span style="color:var(--text-muted)">Ping Predict</span> <span class="data-val">ON</span></div></div><div style="margin-bottom: 1.2rem;"><div class="section-label"><i class="fas fa-sliders-h" style="color:var(--accent);"></i> MULTIPLIERS</div><div class="data-row"><span style="color:var(--text-muted)">Vertical</span> <span class="data-val">${escapeHTML(t.vertical)??'155'}</span></div><div class="data-row"><span style="color:var(--text-muted)">Horizontal</span> <span class="data-val">${escapeHTML(t.horizontal)??'165'}</span></div></div><div style="margin-bottom: 1.2rem;"><div class="section-label">📍 OFFSETS</div><div class="data-row"><span style="color:var(--text-muted)">X / Y / Z</span> <span class="data-val">${escapeHTML(t.offsets)||'0 / -5 / 0'}</span></div></div></div><div><div class="card-footer-box"><div><div class="revert-badge">REVERT | ${escapeHTML(t.hit_rate)||'85%'} HIT RATE</div><div style="font-size:0.75rem; font-weight: 700; color:var(--text-muted); margin-top: 8px;">Supports: ${escapeHTML(t.support_range)||'150ms - 200ms'}</div></div><div style="text-align: right;"><span style="font-size:0.8rem; font-style:italic; font-weight: 600; color:var(--text-muted); display: block;">by <a href="profile.html?name=${encodeURIComponent(t.creator)}" style="color:var(--text-main); text-decoration:underline; cursor:pointer;">${escapeHTML(t.creator)}</a></span></div></div><button class="review-trigger-btn" onclick="openReviews(${t.id})"><i class="fas fa-comments"></i> View Reviews</button></div></div>`).join('');
            if(n.length===0)t.innerHTML=`<p style="color:var(--text-muted); text-align:center; grid-column: 1/-1; padding: 2rem;">No configs match your search criteria.</p>`;
            if(e)e.style.display=currentVisibleCount>=currentFilteredConfigs.length?'none':'block'
        }

        // --- TAG DICTIONARY ---
        const TAG_COLORS = {
            "OWNER": "#f1c40f",
            "DEVELOPER": "#2ecc71",
            "CONTRIBUTOR": "#9b59b6",
            "TUFF": "#e74c3c",
            "TESTER": "#e67e22"
        };
        function getBadgeColor(t){
            const cleanTag = t.trim().toUpperCase();
            return TAG_COLORS[cleanTag] || 'var(--text-muted)';
        }

        async function fetchContributors(){const{data:t}=await _supabase.from('contributors').select('*');let e=(t||[]).sort((t,e)=>(parseInt(t.priority)||999)-(parseInt(e.priority)||999));document.getElementById('contributor-container').innerHTML=e.map(t=>{let e=Array.isArray(t.tags)?t.tags:(t.tags?.split(',').map(t=>escapeHTML(t.trim()))||[]);const n=e.map(t=>`<span class="badge-tag" style="color: ${getBadgeColor(t)};">${t}</span>`).join('');return`<div class="member-card"><div class="member-header"><i class="${t.role_icon?escapeHTML(t.role_icon.trim()):'fa-solid fa-user'}" style="color: ${escapeHTML(t.icon_color)||'#ffffff'}; font-size: 1.2rem;"></i> <span style="font-weight: 900; font-size: 1.2rem;">${escapeHTML(t.name)||'Unknown'}</span></div><div style="display:flex; flex-wrap:wrap; gap:8px;">${n}</div></div>`}).join('')}
        function updateCharCount(){const t=document.getElementById('reviewTextInput'),e=document.getElementById('charCounter'),n=t.value.length;e.innerText=`${n} / 112`;e.style.color=n>112?'var(--danger)':'var(--text-muted)'}
        
        let cooldownTimer=null;
        function showCooldownPopup(t){const e=document.getElementById('customDialogOverlay');document.getElementById('dialogTitle').innerText="Hold up! You're reviewing too fast";document.getElementById('dialogBtnCancel').style.display='none';const n=document.getElementById('dialogMessage'),i=document.getElementById('dialogBtnConfirm');i.innerText='OK';i.className='btn-modal-primary';const c=t=>{const e=Math.floor(t/60),i=t%60;n.innerText=`You may comment again in:\n${e}:${i<10?'0':''}${i}`};c(t);e.classList.add('show');if(cooldownTimer)clearInterval(cooldownTimer);cooldownTimer=setInterval(()=>{t--;if(t<=0){clearInterval(cooldownTimer);n.innerText="You can post now!"}else c(t)},1e3);const o=()=>{e.classList.remove('show');i.removeEventListener('click',o);if(cooldownTimer)clearInterval(cooldownTimer)};i.addEventListener('click',o)}
        
        function buildReviewTree(t){const e=[],n={};t.forEach(t=>n[t.id]={...t,children:[]});t.forEach(t=>{if(t.replying_to_id&&n[t.replying_to_id])n[t.replying_to_id].children.push(n[t.id]);else e.push(n[t.id])});return e}
        
        // --- RENDER REVIEW NODE (UPDATED WITH PROFILE LINK) ---
        function renderReviewNode(t,e=0){
            const n=e>0?30:0,i=Array(5).fill(0).map((n,i)=>i<t.rating?'<i class="fas fa-star"></i>':'<i class="far fa-star"></i>').join(''),c=currentUser&&String(t.poster_id)===String(currentUser.discord_id),o=c?`<button class="delete-btn" title="Delete" onclick="deleteReview(${t.id})"><i class="fas fa-trash"></i></button>`:'';
            let r=`<div class="review-item" id="review-${t.id}" style="margin-left: ${n}px; border-left: ${e>0?'2px solid var(--border)':'none'}; padding-left: ${e>0?'12px':'0'}; margin-bottom: ${e>0?'10px':'20px'};"><img src="${escapeHTML(t.poster_avatar)||'https://via.placeholder.com/40'}" class="review-avatar"><div class="review-content"><div class="review-user-row"><a href="profile.html?user=${t.poster_id}" style="font-weight: 800; font-size:0.95rem; color:var(--text-main); text-decoration:none;">${escapeHTML(t.poster_username)}</a><div>${e===0?`<span class="review-stars" style="margin-right:8px;">${i}</span>`:''}${o}</div></div><p style="font-size:0.9rem; color:var(--text-muted); margin-bottom: 8px;">${escapeHTML(t.comment)}</p><div style="display:flex; gap: 15px; font-size: 0.8rem; font-weight: 700;"><span style="color:var(--text-muted); cursor:pointer; transition:0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'" onclick="setReplyTo(${t.id}, '${escapeHTML(t.poster_username)}')"><i class="fas fa-reply"></i> Reply</span>${t.children.length>0?`<span style="color:var(--accent); cursor:pointer;" onclick="toggleReplies(${t.id})"><i class="fas fa-chevron-down"></i> View ${t.children.length} Replies</span>`:''}</div></div></div>`;
            if(t.children.length>0){r+=`<div id="replies-${t.id}" style="display:none; transition: var(--transition);">`;t.children.forEach(t=>r+=renderReviewNode(t,e+1));r+=`</div>`}
            return r
        }

        async function openReviews(t){activeConfigId=t;replyingToId=null;document.getElementById('replyIndicator').style.display='none';document.getElementById('reviewTextInput').value='';updateCharCount();document.getElementById('reviewModal').classList.add('show');const{data:e}=await _supabase.from('reviews').select('*').eq('config_id',t).order('created_at',{ascending:!0});const n=document.getElementById('reviewList');if(!e||e.length===0){n.innerHTML=`<p style="text-align:center; color:var(--text-muted); padding: 2rem 0;">No reviews yet. Be the first!</p>`;return}const i=buildReviewTree(e);n.innerHTML=i.map(t=>renderReviewNode(t,0)).join('')}
        function toggleReplies(t){const e=document.getElementById(`replies-${t}`);if(e.style.display==='none')e.style.display='block';else e.style.display='none'}
        function setReplyTo(t,e){replyingToId=t;document.getElementById('replyIndicator').style.display='flex';document.getElementById('replyUsername').innerText=e;document.getElementById('reviewTextInput').focus()}
        function cancelReply(){replyingToId=null;document.getElementById('replyIndicator').style.display='none'}
        async function deleteReview(t){const e=await customConfirm("Are you sure you want to delete this comment?","Delete","Delete",!0);if(!e)return;const{error:n}=await _supabase.from('reviews').delete().eq('id',t);if(!n)document.getElementById(`review-${t}`).remove();else await customAlert("Error deleting review.","Error")}
        function closeReviews(t){if(t&&t.target!==document.getElementById('reviewModal'))return;document.getElementById('reviewModal').classList.remove('show');activeConfigId=null;replyingToId=null;document.getElementById('replyIndicator').style.display='none';document.querySelectorAll('.input-star').forEach(el=>el.classList.toggle('active',parseInt(el.getAttribute('data-val'))<=5));currentRatingInput=5;}
        
        document.querySelectorAll('.input-star').forEach(t=>{t.addEventListener('click',e=>{currentRatingInput=parseInt(e.target.getAttribute('data-val'));document.querySelectorAll('.input-star').forEach(t=>t.classList.toggle('active',parseInt(t.getAttribute('data-val'))<=currentRatingInput))})});
        
        async function submitReview(){
            const e=document.getElementById('reviewTextInput'),t=e.value.trim();
            if(!currentUser)return await customAlert("You must be logged in to leave a review.","Notice");
            if(!t||!activeConfigId)return;
            if(t.length>112)return await customAlert(`${t.length}/112`,"Hold up! Your review is too long");
            if(/[<>{}=;]/.test(t))return await customAlert("Your review contains unauthorized coding symbols. Please remove any < > { } = or ; characters.","Security Block");
            
            e.disabled=!0;
            const{data:n}=await _supabase.from('reviews').select('created_at').eq('poster_id',currentUser.discord_id).order('created_at',{ascending:!1}).limit(1).single();
            if(n){
                const t=new Date(n.created_at).getTime(),i=new Date().getTime(),o=3*60*1e3,r=i-t;
                if(r<o){let t=Math.ceil((o-r)/1e3);e.disabled=!1;return showCooldownPopup(t)}
            }
            
            const{error:i}=await _supabase.rpc('submit_secure_review',{p_config_id:activeConfigId,p_poster_id:currentUser.discord_id,p_poster_username:currentUser.username,p_poster_avatar:currentUser.avatar_url,p_rating:replyingToId?null:currentRatingInput,p_comment:t,p_replying_to_id:replyingToId});
            e.disabled=!1;
            
            if(!i){
                e.value='';updateCharCount();cancelReply();openReviews(activeConfigId)
            }else{
                if(i.message.includes('Cooldown active'))await customAlert("The server blocked your request. You must wait 3 minutes.","Security Block");
                else await customAlert("Failed to post review: "+escapeHTML(i.message),"Error")
            }
        }
        
        function toggleTheme(){document.body.classList.toggle('dark-mode');document.getElementById('themeBtn').innerHTML=document.body.classList.contains('dark-mode')?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>';localStorage.setItem('theme',document.body.classList.contains('dark-mode')?'dark':'light')}
        async function handleLogoutClick(){if(await customConfirm("Are you sure you want to log out?","Logout","Log Out",!0))await _supabase.auth.signOut()}
    </script>
</body>
</html>
