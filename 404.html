<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KrazyKonfigs | 404 Not Found</title><link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;700;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:'Source Sans Pro',sans-serif;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;text-align:center;padding:2rem;opacity:0;transition:opacity .5s ease}body.ready{opacity:1}.bg-fx{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:-1;overflow:hidden}.bg-fx::after,.bg-fx::before{content:'';position:absolute;border-radius:50%;filter:blur(150px);animation:floatBg 25s infinite alternate ease-in-out}.bg-fx::before{width:60vw;height:60vw;background:#fff;opacity:.03;top:-20vh;left:-10vw}.bg-fx::after{width:50vw;height:50vw;background:#fff;opacity:.02;bottom:-10vh;right:-5vw;animation-delay:-12s}@keyframes floatBg{0%{transform:translate(0,0) scale(1)}100%{transform:translate(5vw,5vh) scale(1.1)}}#smooth-cursor{position:fixed;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 15px rgba(255,255,255,.5);pointer-events:none;z-index:10000;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s}.container{max-width:1200px;animation:fadeIn 1s ease-out;position:relative;z-index:10}h1{font-size:clamp(6rem,15vw,12rem);font-weight:900;text-transform:uppercase;letter-spacing:-4px;line-height:1;margin-bottom:0;color:#5865F2;text-shadow:0 0 40px rgba(88,101,242,.4)}h2{font-size:clamp(2rem,5vw,3rem);font-weight:900;text-transform:uppercase;letter-spacing:-1px;margin-bottom:1.5rem}.divider{height:4px;width:80px;background:#fff;margin:0 auto 2rem}p{font-size:clamp(1rem,2.5vw,1.2rem);font-weight:600;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:3rem}body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background-image:url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.04"/%3E%3C/svg%3E');pointer-events:none;z-index:1}@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.return-btn{padding:16px 40px;background:#fff;color:#000;text-decoration:none;font-weight:800;border-radius:4px;border:2px solid #fff;cursor:pointer;transition:.3s;text-transform:uppercase;letter-spacing:1px;display:inline-flex;align-items:center;gap:10px}.return-btn:hover{background:0 0;color:#fff;transform:scale(1.05)}</style><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body><div class="bg-fx"></div><div id="smooth-cursor"></div><div class="container"><h1>404</h1><h2>Lost in the Vault</h2><div class="divider"></div><p>The configuration or page you are looking for does not exist.</p><a href="/dashboard.html" class="return-btn"><i class="fas fa-undo-alt"></i> Return to Dashboard</a></div><script>const cursor=document.getElementById('smooth-cursor');let curX=innerWidth/2,curY=innerHeight/2,tgX=curX,tgY=curY;window.addEventListener('mousemove',e=>{tgX=e.clientX;tgY=e.clientY});function anim(){curX+=(tgX-curX)*.15;curY+=(tgY-curY)*.15;cursor.style.left=curX+'px';cursor.style.top=curY+'px';requestAnimationFrame(anim)}anim();document.querySelectorAll('a, button').forEach(e=>{e.addEventListener('mouseenter',()=>cursor.style.transform='translate(-50%, -50%) scale(1.5)');e.addEventListener('mouseleave',()=>cursor.style.transform='translate(-50%, -50%) scale(1)')});window.onload=()=>{document.body.classList.add('ready')};</script></body></html>
