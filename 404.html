<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 LMAO</title>
    <style>
        /* THE FLASHBANG */
        body { 
            margin: 0; padding: 0; height: 100vh; 
            background-color: #ffffff; /* pure retina-burning white */
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            overflow: hidden; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
        }

        /* HUMONGOUS 404 */
        h1 { 
            font-size: 35vw; 
            margin: 0; line-height: 0.8; 
            z-index: 10; font-weight: 900; color: #000000; 
        }

        /* ANTI-BLUE LINK */
        a { 
            font-size: clamp(1.5rem, 4vw, 3rem); 
            color: #000000; text-decoration: none; font-weight: 900; 
            z-index: 10; padding: 15px 30px; border: 5px dashed #000000; 
            background-color: #ffffff; transition: 0.2s; text-align: center; margin-top: 20px;
        }
        
        a:hover { 
            background-color: #000000; color: #ffffff; 
            transform: scale(1.1) rotate(-3deg); 
        }

        /* SCATTERED SUS IMAGES */
        .sus-img { 
            position: absolute; z-index: 1; max-width: 25vw; 
            animation: float 3s ease-in-out infinite alternate; 
        }
        
        .img1 { top: 5%; left: 5%; transform: rotate(-20deg); animation-delay: 0s; }
        .img2 { bottom: 10%; right: 5%; transform: rotate(25deg); animation-delay: 1s; }
        .img3 { top: 15%; right: 10%; transform: rotate(45deg); animation-delay: 0.5s; }
        .img4 { bottom: 15%; left: 10%; transform: rotate(-35deg); animation-delay: 1.5s; }

        @keyframes float { 
            from { margin-top: 0; } 
            to { margin-top: 30px; } 
        }
    </style>
</head>
<body>
    <img src="/assets/images/sus/amongus.webp" class="sus-img img1" alt="sus">
    <img src="/assets/images/sus/dolady.webp" class="sus-img img2" alt="sus">
    <img src="/assets/images/sus/eeee.webp" class="sus-img img3" alt="sus">
    <img src="/assets/images/sus/thebige.webp" class="sus-img img4" alt="sus">
    
    <h1>404</h1>
    <a href="/dashboard.html">braaah return to dashboard now !!!!!</a>
</body>
</html>
