<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrazyKonfigs | Entry</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-body: #fff;
            --text-main: #000;
            --text-muted: #666;
            --border: #eee;
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            --accent: #5865F2;
            --danger: #ed4245;
        }

        body.dark-mode {
            --bg-body: #0a0a0a;
            --text-main: #fff;
            --text-muted: #aaa;
            --border: #1f1f1f;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Source Sans Pro', sans-serif;
            margin: 0;
            transition: background 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Ambient cursor effect */
        #smooth-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
        }
        body:not(.dark-mode) #smooth-cursor {
            background: rgba(0, 0, 0, 0.15);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
        }

        nav {
            padding: 1.5rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            z-index: 100;
            background: transparent;
            box-sizing: border-box;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: contain;
            image-rendering: auto;
            transform: translateZ(0);
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 5.5rem);
            font-weight: 900;
            letter-spacing: -4px;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .btn-get-started {
            padding: 16px 45px;
            background: var(--text-main);
            color: var(--bg-body);
            text-decoration: none;
            font-weight: 700;
            border-radius: 4px;
            border: 2px solid var(--text-main);
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-get-started:hover {
            background: transparent;
            color: var(--text-main);
            transform: scale(1.05);
        }

        .theme-toggle {
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.4s ease;
        }
        .theme-toggle:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div id="smooth-cursor"></div>
    
    <nav>
        <img src="/assets/images/logo.png" alt="Logo" class="brand-logo" onerror="this.src='./assets/images/logo.png'">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
            <i class="fas fa-moon"></i>
        </button>
    </nav>

    <section class="hero">
        <h1>Krazy Konfigs</h1>
        <p style="max-width: 600px; margin-bottom: 3rem; color: var(--text-muted);">
            Precision-engineered simulation presets. Authorized access only.
        </p>
        <div onclick="handleStart()" class="btn-get-started">
            GET STARTED <i class="fas fa-arrow-right" style="margin-left: 10px;"></i>
        </div>
    </section>

    <script>
        // Init Supabase
        const _supabase = supabase.createClient(
            'https://unjdjduiqtldgoybgmnq.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuamRqZHVpcXRsZGdveWJnbW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MzgzODEsImV4cCI6MjA5MzAxNDM4MX0.qMuQcBysiKuFD5ByoL17fs0KxClgI-FEyzyKYayNVdE'
        );

        // Custom cursor tracking
        const cursor = document.getElementById('smooth-cursor');
        let curX = window.innerWidth / 2;
        let curY = window.innerHeight / 2;
        let tgX = curX;
        let tgY = curY;

        window.addEventListener('mousemove', e => {
            tgX = e.clientX;
            tgY = e.clientY;
        });

        function anim() {
            curX += (tgX - curX) * 0.15;
            curY += (tgY - curY) * 0.15;
            cursor.style.left = curX + 'px';
            cursor.style.top = curY + 'px';
            requestAnimationFrame(anim);
        }
        anim();

        // Hover effects for the cursor
        document.querySelectorAll('a, button, .btn-get-started').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
            });
        });

        // App logic
        async function handleStart() {
            const { data: { session } } = await _supabase.auth.getSession();
            window.location.href = session ? '/dashboard' : '/login';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeBtn').innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Apply theme on load to prevent flashing
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeBtn').innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('themeBtn').innerHTML = '<i class="fas fa-moon"></i>';
            }
        });
    </script>
</body>
</html>
