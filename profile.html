<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrazyKonfigs | Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-body: #f4f4f5;
            --bg-nav: rgba(255, 255, 255, 0.95);
            --text-main: #000;
            --text-muted: #666;
            --border: #eee;
            --card-bg: #fff;
            --tag-bg: #f0f0f0;
            --accent: #5865F2;
            --danger: #ed4245;
        }

        body.dark-mode {
            --bg-body: #0a0a0a;
            --bg-nav: rgba(10, 10, 10, 0.95);
            --text-main: #fff;
            --text-muted: #aaa;
            --border: #1f1f1f;
            --card-bg: #121212;
            --tag-bg: #1a1a1a;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Source Sans Pro', sans-serif;
            margin: 0; padding: 0;
            transition: background-color 0.3s;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Nav Header Override for Profile Page */
        header {
            width: 100%; padding: 1.5rem 5%; background: var(--bg-nav);
            border-bottom: 1px solid var(--border); display: flex;
            justify-content: space-between; align-items: center;
            box-sizing: border-box; backdrop-filter: blur(10px);
            position: fixed; top: 0; z-index: 1000;
        }

        .header-brand { display: flex; align-items: center; gap: 0.8rem; cursor: pointer; text-decoration: none; color: var(--text-main); }
        .header-logo { width: 32px; height: 32px; border-radius: 4px; }
        .theme-toggle { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-main); transition: 0.3s; }
        .theme-toggle:hover { color: var(--accent); }

        /* Profile Layout */
        .profile-container {
            margin-top: 100px; width: 90%; max-width: 600px;
            display: flex; flex-direction: column; gap: 1.5rem;
            animation: fadeIn 0.5s ease; padding-bottom: 3rem;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-muted); text-decoration: none; font-weight: 800;
            margin-bottom: -0.5rem; transition: 0.2s; font-size: 0.9rem; text-transform: uppercase;
        }
        .back-btn:hover { color: var(--text-main); transform: translateX(-5px); }

        /* The Main Profile Card (guns.lol style) */
        .profile-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; gap: 1.5rem; position: relative;
            overflow: hidden;
        }

        body.dark-mode .profile-card { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .profile-header-row { display: flex; align-items: center; gap: 1.5rem; position: relative; z-index: 2; }
        
        .profile-avatar {
            width: 90px; height: 90px; border-radius: 50%;
            border: 3px solid var(--border); object-fit: cover;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); background: var(--bg-body);
        }

        .profile-info { flex: 1; }
        .profile-name { font-size: 1.8rem; font-weight: 900; margin: 0 0 4px 0; display: flex; align-items: center; gap: 10px; }
        .profile-username { font-size: 1rem; color: var(--text-muted); font-weight: 600; margin: 0; }
        
        .guild-tag {
            font-size: 0.7rem; padding: 4px 8px; border-radius: 6px;
            background: var(--tag-bg); color: var(--text-main); font-weight: 800; border: 1px solid var(--border);
        }

        /* Badges */
        .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .role-badge { font-size: 0.75rem; padding: 5px 12px; border-radius: 20px; font-weight: 800; text-transform: uppercase; }
        .badge-user { background: rgba(88, 101, 242, 0.1); color: #5865F2; border: 1px solid #5865F2; }
        .badge-creator { background: rgba(241, 196, 15, 0.1); color: #f1c40f; border: 1px solid #f1c40f; }

        .contributor-tags { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 1rem; border-top: 1px solid var(--border); position: relative; z-index: 2;}
        .con-tag { font-size: 0.7rem; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); font-weight: 700; color: var(--text-main); background: var(--card-bg); }

        /* Review History Card */
        .history-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .history-title { font-size: 1.2rem; font-weight: 900; margin: 0 0 1.5rem 0; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem; }
        
        .review-item { display: flex; gap: 12px; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px dashed var(--border); }
        .review-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .review-content { flex: 1; }
        .review-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .review-target { font-size: 0.8rem; font-weight: 800; color: var(--accent); text-decoration: none;}
        .review-target:hover { text-decoration: underline; }
        .review-stars { color: #f1c40f; font-size: 0.75rem; }
        .review-text { font-size: 0.9rem; color: var(--text-muted); margin: 0; line-height: 1.4; }

        .spinner { margin: 5rem auto; width: 40px; height: 40px; border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body id="body">

    <header>
        <a href="dashboard.html" class="header-brand">
            <img src="/assets/images/logo.png" class="header-logo" alt="Logo" onerror="this.src='./assets/images/logo.png'">
            <span style="font-weight:900;font-size:1.2rem;text-transform:uppercase">Krazy Konfigs</span>
        </a>
        <div style="display: flex; gap: 1rem;">
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <div class="profile-container" id="profileContainer">
        <div class="spinner"></div>
    </div>

    <script>
        const _supabase = supabase.createClient('https://unjdjduiqtldgoybgmnq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuamRqZHVpcXRsZGdveWJnbW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MzgzODEsImV4cCI6MjA5MzAxNDM4MX0.qMuQcBysiKuFD5ByoL17fs0KxClgI-FEyzyKYayNVdE');

        // Theme Initialization
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeBtn').innerHTML = '<i class="fas fa-sun"></i>';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeBtn').innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function escapeHTML(str) {
            if(!str) return '';
            return str.toString().replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        async function loadProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetDiscordId = urlParams.get('user');
            const container = document.getElementById('profileContainer');

            if (!targetDiscordId) {
                container.innerHTML = `<h2 style="text-align:center;">User ID not provided.</h2><a href="dashboard.html" style="text-align:center; color:var(--accent);">Return Home</a>`;
                return;
            }

            try {
                // 1. Fetch User Data
                const { data: user, error: userError } = await _supabase.from('users').select('*').eq('discord_id', targetDiscordId).single();
                
                if (userError || !user) {
                    container.innerHTML = `<h2 style="text-align:center;">User not found in the database.</h2><a href="dashboard.html" style="text-align:center; color:var(--accent); display:block;">Return Home</a>`;
                    return;
                }

                // Compile names to check for tags (Both Username AND Display Name)
                const dName = user.display_name || user.username;
                const uName = user.username;
                const namesToCheck = [uName];
                if(dName !== uName) namesToCheck.push(dName);

                // 2. Check if Creator (Using .in to check multiple names simultaneously)
                const { data: configs } = await _supabase.from('configs').select('id').in('creator', namesToCheck).limit(1);
                const isCreator = configs && configs.length > 0;

                // 3. Fetch Contributor Tags
                const { data: contributorData } = await _supabase.from('contributors').select('tags').in('name', namesToCheck).limit(1);
                const contributor = contributorData ? contributorData[0] : null;
                const tags = contributor && contributor.tags ? (Array.isArray(contributor.tags) ? contributor.tags : contributor.tags.split(',')) : [];

                // 4. Fetch Reviews History
                const { data: reviews } = await _supabase.from('reviews').select('*').eq('poster_id', targetDiscordId).order('created_at', { ascending: false }).limit(10);

                // Build HTML
                let profileHTML = `
                    <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
                    
                    <div class="profile-card" style="background-color: ${user.profile_theme || 'var(--card-bg)'}; background-image: linear-gradient(rgba(0,0,0,0.4), var(--card-bg) 65%);">
                        <div class="profile-header-row">
                            <img src="${escapeHTML(user.avatar_url) || 'https://via.placeholder.com/90'}" class="profile-avatar" alt="PFP">
                            <div class="profile-info">
                                <h1 class="profile-name">
                                    ${escapeHTML(dName)}
                                    ${user.guild_tag ? `<span class="guild-tag">${escapeHTML(user.guild_tag)}</span>` : ''}
                                </h1>
                                <p class="profile-username">@${escapeHTML(uName).toLowerCase().replace(/\s/g, '')}</p>
                                
                                <div class="badge-row">
                                    <span class="role-badge badge-user"><i class="fas fa-user"></i> User</span>
                                    ${isCreator ? `<span class="role-badge badge-creator"><i class="fas fa-hammer"></i> Creator</span>` : ''}
                                </div>
                            </div>
                        </div>
                        ${tags.length > 0 ? `
                        <div class="contributor-tags">
                            ${tags.map(t => `<span class="con-tag">${escapeHTML(t.trim())}</span>`).join('')}
                        </div>
                        ` : ''}
                    </div>
                `;

                // Build Reviews HTML
                let reviewsHTML = `
                    <div class="history-card">
                        <h3 class="history-title">Recent Activity</h3>
                `;

                if (!reviews || reviews.length === 0) {
                    reviewsHTML += `<p style="color:var(--text-muted); font-size:0.9rem;">This user hasn't left any reviews yet.</p>`;
                } else {
                    reviewsHTML += reviews.map(r => {
                        const stars = Array(5).fill(0).map((_, i) => i < r.rating ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>').join('');
                        return `
                        <div class="review-item">
                            <img src="${escapeHTML(r.poster_avatar)}" style="width:36px; height:36px; border-radius:50%; object-fit:cover; border:1px solid var(--border);">
                            <div class="review-content">
                                <div class="review-meta">
                                    <a href="dashboard.html#configs" class="review-target">Config ID: #${r.config_id}</a>
                                    <span class="review-stars">${r.rating ? stars : '<i class="fas fa-reply" style="color:var(--text-muted)"></i> Reply'}</span>
                                </div>
                                <p class="review-text">${escapeHTML(r.comment)}</p>
                            </div>
                        </div>
                        `;
                    }).join('');
                }
                reviewsHTML += `</div>`;

                container.innerHTML = profileHTML + reviewsHTML;

            } catch (err) {
                container.innerHTML = `<p style="color:var(--danger); text-align:center;">Failed to load profile data.</p><a href="dashboard.html" style="text-align:center; color:var(--accent); display:block;">Return Home</a>`;
                console.error(err);
            }
        }

        window.onload = loadProfile;
    </script>
</body>
</html>
