<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrazyKonfigs | Secure Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --sidebar-bg: #0a0a0a;
            --main-bg: #0f0f0f;
            --card-bg: #161616;
            --accent: #5865F2;
            --text: #ffffff;
            --text-dim: #888888;
            --border: #1f1f1f;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Source Sans Pro', sans-serif; }
        body { background: var(--main-bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        #security-guard {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: opacity 0.5s ease;
        }
        .guard-spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent); border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite; margin-bottom: 1.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-brand { padding: 2rem 1.5rem; display: flex; align-items: center; gap: 12px; }
        .logo-box { width: 35px; height: 35px; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 8px; }
        
        .nav-group { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin: 1.5rem 1.5rem 0.5rem; font-weight: 800; }
        .nav-btn { padding: 12px 1.5rem; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; gap: 12px; transition: var(--transition); font-weight: 600; border-left: 3px solid transparent; }
        .nav-btn:hover { background: rgba(255,255,255,0.03); color: #fff; }
        .nav-btn.active { background: rgba(88, 101, 242, 0.05); color: #fff; border-left-color: var(--accent); }
        .nav-btn i { width: 20px; text-align: center; }

        .wrapper { flex: 1; display: flex; flex-direction: column; }
        .header { height: 80px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; padding: 0 2.5rem; }

        .profile-container { position: relative; }
        .profile-trigger { 
            display: flex; align-items: center; gap: 0; cursor: pointer; 
            padding: 6px; border-radius: 40px; background: var(--card-bg); 
            border: 1px solid var(--border); transition: var(--transition);
        }
        .profile-trigger:hover { gap: 12px; padding: 6px 18px 6px 6px; border-color: var(--accent); }
        
        .username-reveal { max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; font-weight: 700; transition: var(--transition); }
        .profile-trigger:hover .username-reveal { max-width: 150px; opacity: 1; }
        
        .profile-pfp { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--border); }
        .dropdown { 
            position: absolute; top: calc(100% + 10px); right: 0; width: 180px; 
            background: var(--sidebar-bg); border: 1px solid var(--border); 
            border-radius: 12px; display: none; flex-direction: column; padding: 8px; z-index: 100;
        }
        .dropdown.active { display: flex; }
        .drop-link { padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-dim); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .drop-link:hover { background: var(--card-bg); color: #fff; }

        #dynamic-container { flex: 1; padding: 3rem; overflow-y: auto; }
        .home-hero h1 { font-size: 3rem; font-weight: 900; margin-bottom: 8px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .stat-box { background: var(--card-bg); border: 1px solid var(--border); padding: 1.5rem; border-radius: 16px; }
        .stat-box h2 { font-size: 2.2rem; font-weight: 900; color: var(--accent); }
    </style>
</head>
<body>

    <div id="security-guard">
        <div class="guard-spinner"></div>
        <p style="font-weight: 800; letter-spacing: 2px; font-size: 0.8rem;">AUTHENTICATING ACCESS</p>
    </div>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo-box">K</div>
            <span style="font-weight: 900; font-size: 1.3rem;">KRAZY PANEL</span>
        </div>

        <div class="nav-group">User Management</div>
        <div class="nav-btn active" onclick="loadContent('home', this)"><i class="fas fa-chart-pie"></i> Home Overview</div>
        <div class="nav-btn" onclick="loadContent('users', this)"><i class="fas fa-users"></i> Users</div>

        <div class="nav-group">System Health</div>
        <div class="nav-btn" onclick="loadContent('db', this)"><i class="fas fa-database"></i> DB Overview</div>
    </aside>

    <div class="wrapper">
        <header class="header">
            <div class="profile-container">
                <div class="profile-trigger" onclick="toggleDropdown(event)">
                    <img src="" id="adminPfp" class="profile-pfp" alt="">
                    <span class="username-reveal" id="adminName">Admin</span>
                </div>
                <div class="dropdown" id="profileDropdown">
                    <a href="dashboard.html" class="drop-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                    <a href="#" class="drop-link" style="color:#ff4757" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Log Out</a>
                </div>
            </div>
        </header>

        <main id="dynamic-container"></main>
    </div>

    <script>
        const SUPABASE_URL = "https://unjdjduiqtldgoybgmnq.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuamRqZHVpcXRsZGdveWJnbW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MzgzODEsImV4cCI6MjA5MzAxNDM4MX0.qMuQcBysiKuFD5ByoL17fs0KxClgI-FEyzyKYayNVdE";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        // FIXED SECURITY LOGIC (No .single(), handles 406 error)
        async function runSecurityAudit() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }

            const { data: profiles, error } = await _supabase
                .from('users')
                .select('rank, username, avatar_url')
                .eq('id', session.user.id);

            if (error) { console.error("Audit Error:", error.message); return; }

            const profile = (profiles && profiles.length > 0) ? profiles[0] : null;

            if (!profile || profile.rank !== 'admin') {
                window.location.href = 'dashboard.html';
                return;
            }

            currentUser = profile;
            initAdminPanel();
        }

        function initAdminPanel() {
            document.getElementById('adminName').innerText = currentUser.username;
            document.getElementById('adminPfp').src = currentUser.avatar_url;
            document.getElementById('security-guard').style.display = 'none';
            loadContent('home', document.querySelector('.nav-btn.active'));
        }

        async function loadContent(module, btnElement) {
            const container = document.getElementById('dynamic-container');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            if (module === 'home') {
                const { count: userCount } = await _supabase.from('users').select('*', { count: 'exact', head: true });
                container.innerHTML = `
                    <div class="home-hero">
                        <h1>System Overview</h1>
                        <div class="stats-grid">
                            <div class="stat-box"><span>Registered Users</span><h2>${userCount || 0}</h2></div>
                            <div class="stat-box"><span>Status</span><h2 style="color: #2ecc71;">ONLINE</h2></div>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `<h1>${btnElement.innerText}</h1><p>Module coming soon.</p>`;
            }
        }

        function toggleDropdown(e) { e.stopPropagation(); document.getElementById('profileDropdown').classList.toggle('active'); }
        window.onclick = () => document.getElementById('profileDropdown').classList.remove('active');
        async function handleLogout() { await _supabase.auth.signOut(); window.location.href = 'login.html'; }

        runSecurityAudit();
    </script>
</body>
</html>
