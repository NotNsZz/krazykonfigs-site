    <style>
        :root {
            --sidebar-bg: #0a0a0a;
            --main-bg: #0f0f0f;
            --card-bg: #161616;
            --accent: #5865F2;
            --danger: #ed4245;
            --success: #2ecc71;
            --text: #ffffff;
            --text-dim: #888888;
            --border: #1f1f1f;
            --input-bg: #111111;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Source Sans Pro', sans-serif; }
        body { background: var(--main-bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* Security Screen */
        #security-guard {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: opacity 0.5s ease;
        }
        .guard-spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent); border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite; margin-bottom: 1.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Sidebar */
        .sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-brand { padding: 2rem 1.5rem; display: flex; align-items: center; gap: 12px; }
        .logo-box { width: 35px; height: 35px; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 8px; }
        
        .nav-group { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin: 1.5rem 1.5rem 0.5rem; font-weight: 800; }
        .nav-btn { padding: 12px 1.5rem; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; gap: 12px; transition: var(--transition); font-weight: 600; border-left: 3px solid transparent; font-size: 0.95rem; }
        .nav-btn:hover { background: rgba(255,255,255,0.03); color: #fff; }
        .nav-btn.active { background: rgba(88, 101, 242, 0.05); color: #fff; border-left-color: var(--accent); }
        .nav-btn i { width: 20px; text-align: center; }

        /* Top Header */
        .wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 70px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; padding: 0 2.5rem; background: var(--main-bg); }

        .profile-container { position: relative; }
        .profile-trigger { 
            display: flex; align-items: center; gap: 0; cursor: pointer; 
            padding: 4px; border-radius: 40px; background: var(--card-bg); 
            border: 1px solid var(--border); transition: var(--transition);
        }
        .profile-trigger:hover { gap: 12px; padding: 4px 18px 4px 4px; border-color: var(--accent); }
        .username-reveal { max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; font-weight: 700; transition: var(--transition); font-size: 0.9rem; }
        .profile-trigger:hover .username-reveal { max-width: 150px; opacity: 1; }
        .profile-pfp { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border); }
        
        .dropdown { 
            position: absolute; top: calc(100% + 10px); right: 0; width: 180px; 
            background: var(--sidebar-bg); border: 1px solid var(--border); 
            border-radius: 12px; display: none; flex-direction: column; padding: 8px; z-index: 100;
        }
        .dropdown.active { display: flex; }
        .drop-link { padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-dim); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .drop-link:hover { background: var(--card-bg); color: #fff; }

        /* Content Area */
        #dynamic-container { flex: 1; padding: 2.5rem; overflow-y: auto; }
        
        /* UI Components */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .page-header h1 { font-size: 2rem; font-weight: 900; letter-spacing: -0.5px; }
        
        .search-bar { 
            background: var(--input-bg); border: 1px solid var(--border); padding: 10px 16px; 
            border-radius: 8px; color: var(--text); width: 250px; outline: none; font-family: inherit; font-size: 0.9rem;
        }
        .search-bar:focus { border-color: var(--accent); }

        .btn-primary { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: var(--transition); }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-danger { background: rgba(237, 66, 69, 0.1); color: var(--danger); border: 1px solid rgba(237, 66, 69, 0.2); padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: var(--transition); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-secondary { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: var(--transition); }
        .btn-secondary:hover { background: var(--border); }

        /* Grid Layouts */
        .config-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        
        /* Config Card Style */
        .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; }
        .item-card h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 1rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border); }
        .card-section { margin-bottom: 1rem; }
        .card-section h4 { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 800; }
        .data-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; }
        .data-label { color: var(--text-dim); font-weight: 600; }
        .data-val { font-weight: 700; }
        .card-actions { display: flex; gap: 10px; margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); }

        /* Table Style */
        .data-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .data-table th, .data-table td { padding: 14px 20px; text-align: left; font-size: 0.95rem; border-bottom: 1px solid var(--border); }
        .data-table th { background: rgba(255,255,255,0.02); color: var(--text-dim); font-weight: 800; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tbody tr:hover { background: rgba(255,255,255,0.01); }

        /* Toggle Switch */
        .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: var(--text-dim); transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }

        /* Dropdown Select */
        .status-select { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; outline: none; font-weight: 600; }

    </style>
</head>
