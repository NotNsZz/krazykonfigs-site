<div class="modal-overlay" id="creatorPromoOverlay">
    <div class="modal-content" style="max-width: 450px; text-align: center;">
        <div class="modal-header" style="justify-content: flex-end; border-bottom: none; margin-bottom: 0;">
            <button class="dialog-close-x" onclick="closeCreatorPromo()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <h2 style="margin-top: 0; font-weight: 900;">Config Creator?</h2>
            <p style="color: var(--text-muted); margin: 0.5rem 0 1.5rem 0; line-height: 1.5;">Hey! Wait, are you a config creator? If yes, we'd like to have your configs on the site :3</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-modal-danger" style="flex: 1;" onclick="closeCreatorPromo()">Cancel</button>
                <a href="https://discord.gg/YOUR_INVITE_HERE" target="_blank" class="btn-modal-primary" style="flex: 1; background: #5865F2; border-color: #5865F2; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;" onclick="closeCreatorPromo()"><i class="fab fa-discord"></i> Contact Me</a>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="reviewModal">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h2 style="margin: 0;"><i class="fas fa-comments" style="color:var(--accent);"></i> Reviews</h2>
            <button class="dialog-close-x" onclick="closeReviews()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" style="max-height: 60vh; overflow-y: auto; padding-right: 5px;">
            <div id="reviewList">
                <div style="text-align:center; padding: 2rem 0; color:var(--accent);"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>
            </div>
        </div>
        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
            <div id="replyIndicator" style="display:none; align-items:center; justify-content:space-between; background:var(--bg-body); padding:8px 12px; border-radius:6px; margin-bottom:10px; border:1px solid var(--border);">
                <span style="font-size:0.85rem; color:var(--text-muted); font-weight:700;"><i class="fas fa-reply"></i> Replying to <span id="replyUsername" style="color:var(--accent);"></span></span>
                <button onclick="cancelReply()" style="background:none; border:none; color:var(--danger); cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            
            <div style="display:flex; flex-direction: column; gap:10px;">
                <textarea id="reviewTextInput" placeholder="Write your review here..." maxlength="112" onkeyup="updateCharCount()" style="width:100%; height:80px; background:var(--bg-body); border:1px solid var(--border); color:var(--text-main); padding:10px; border-radius:8px; resize:none; font-family:inherit;"></textarea>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span id="charCounter" style="font-size:0.8rem; color:var(--text-muted); font-weight:700;">0 / 112</span>
                    <div style="display:flex; align-items:center; gap: 15px;">
                        <div class="input-stars" style="display:flex; gap:5px; color:#f1c40f; font-size:1.1rem; cursor:pointer;">
                            <i class="fas fa-star input-star active" data-val="1"></i>
                            <i class="fas fa-star input-star active" data-val="2"></i>
                            <i class="fas fa-star input-star active" data-val="3"></i>
                            <i class="fas fa-star input-star active" data-val="4"></i>
                            <i class="fas fa-star input-star active" data-val="5"></i>
                        </div>
                        <button class="btn-modal-primary" onclick="submitReview()"><i class="fas fa-paper-plane"></i> Post</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="customDialogOverlay" style="z-index: 9999;">
    <div class="modal-content" style="max-width: 400px; text-align:center;">
        <div class="modal-header" style="justify-content: space-between; margin-bottom: 0.5rem;">
            <h3 id="dialogTitle" style="margin: 0; font-weight: 900;">Notice</h3>
            <button class="dialog-close-x" id="dialogCloseX"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <p id="dialogMessage" style="color:var(--text-muted); font-weight: 600; margin-bottom: 1.5rem;"></p>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button id="dialogBtnCancel" class="btn-modal-danger" style="flex:1;">Cancel</button>
                <button id="dialogBtnConfirm" class="btn-modal-primary" style="flex:1;">Confirm</button>
            </div>
        </div>
    </div>
</div>
