<section class="section-padding" id="configs">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2.5rem; flex-wrap:wrap; gap:1rem">
        <h2 style="font-weight:900; font-size:2rem; letter-spacing:-1px">CONFIGS</h2>
        <div style="display:flex; gap:0.8rem; flex-wrap:wrap; align-items:center">
            <input type="text" id="configSearch" class="form-input" style="margin:0; width:220px; padding:8px 16px; min-height:38px" placeholder="Search configs..." oninput="applyFilters()"> 
            <select id="creatorFilter" class="form-input" style="margin:0; width:auto; padding:8px 16px; min-height:38px" onchange="applyFilters()">
                <option value="all">By Creator</option>
            </select> 
            <button class="filter-btn active" onclick="applyFilters('all', this)">All</button> 
            <button class="filter-btn" onclick="applyFilters('low', this)">Low Ping</button> 
            <button class="filter-btn" onclick="applyFilters('mid', this)">Mid Ping</button> 
            <button class="filter-btn" onclick="applyFilters('high', this)">High Ping</button>
        </div>
    </div>
    <div class="config-grid" id="config-container"></div>
    <div id="showMoreConfigsBtnWrap" style="text-align:center; margin-top:2.5rem; display:none">
        <button class="hero-btn" style="width:100%; max-width:800px; padding:18px; letter-spacing:2px" onclick="showMoreConfigs()">SHOW MORE CONFIGS <i class="fas fa-chevron-down" style="margin-left:10px"></i></button>
    </div>
</section>
