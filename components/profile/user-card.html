<div class="profile-card" id="p-card-bg">
    <div class="profile-header-row">
        <img src="/assets/images/logo.png" id="p-avatar" class="profile-avatar" alt="PFP">
        <div class="profile-info">
            <h1 class="profile-name">
                <span id="p-dname">Loading...</span> 
            </h1>
            <p class="profile-username">
                <span class="status-dot online" title="Online"></span>
                <span id="p-uname">@loading</span>
            </p>
            
            <div class="badge-row" id="p-badges">
                <span class="role-badge badge-user"><i class="fas fa-circle-notch fa-spin"></i> Fetching...</span>
            </div>
            
            <div class="badge-row" id="p-tags" style="display: none; margin-top: 8px;">
                </div>
        </div>
    </div>

    <div class="profile-stats-grid">
        <div class="stat-box">
            <div class="stat-value" id="stat-configs">0</div>
            <div class="stat-label">Configs Published</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="stat-joined">-</div>
            <div class="stat-label">Joined</div>
        </div>
    </div>
