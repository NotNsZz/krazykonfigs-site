<a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

<div class="profile-card" id="p-card-bg">
    <div class="profile-header-row">
        <img src="/assets/images/logo.png" id="p-avatar" class="profile-avatar" alt="PFP">
        <div class="profile-info">
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <h1 class="profile-name" id="p-dname">Loading...</h1>
                <i id="p-verified" class="fas fa-certificate" style="color: #1abc9c; display: none; font-size: 1.2rem; margin-top: 5px;" title="Verified Creator"></i>
                <span id="p-guild"></span>
                <div id="p-discord-badges" style="display: flex; gap: 4px;"></div>
            </div>
            
            <p class="profile-username">
                <span class="status-dot" id="p-status-dot" title="Offline"></span>
                <span id="p-uname">@loading</span>
            </p>
            
            <div class="badge-row" id="p-badges"></div>
        </div>
        
        <div id="stat-joined" style="position: absolute; top: 1.5rem; right: 1.5rem; font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Joined: --</div>
    </div>
    
    <div class="profile-bio-section" style="margin-top: 0.5rem;">
        <p class="profile-bio" id="p-bio" style="font-size: 1rem; color: var(--text-muted); font-style: italic; margin-bottom: 1.2rem; line-height: 1.5;">...</p>
        
        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="#" id="p-discord-link" target="_blank" class="social-btn" title="View Discord Profile" style="display: flex; justify-content: center; align-items: center; width: 40px; height: 40px; border-radius: 8px; background: var(--tag-bg); color: #5865F2; text-decoration: none; font-size: 1.2rem; transition: 0.2s; border: 1px solid var(--border);">
                <i class="fab fa-discord"></i>
            </a>
            
            <span style="color: var(--text-muted); font-size: 0.85rem; font-weight: 800; margin-left: auto; text-transform: uppercase; letter-spacing: 1px;">
                <i class="fas fa-eye" style="margin-right: 5px;"></i> <span id="p-views">0</span> Views
            </span>
        </div>
    </div>

    <div class="contributor-tags" id="p-tags" style="display: none; margin-top: 1rem;"></div>
</div>
