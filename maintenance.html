<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrazyKonfigs | Maintenance</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* --- RESET & BASICS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Source Sans Pro', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 2rem;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.ready {
            opacity: 1;
        }

        /* --- AMBIENT BACKGROUND FX --- */
        .bg-fx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .bg-fx::after, .bg-fx::before {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(150px);
            animation: floatBg 25s infinite alternate ease-in-out;
        }

        .bg-fx::before {
            width: 60vw;
            height: 60vw;
            background: #fff;
            opacity: 0.03;
            top: -20vh;
            left: -10vw;
        }

        .bg-fx::after {
            width: 50vw;
            height: 50vw;
            background: #fff;
            opacity: 0.02;
            bottom: -10vh;
            right: -5vw;
            animation-delay: -12s;
        }

        @keyframes floatBg {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5vw, 5vh) scale(1.1); }
        }

        /* --- SVG NOISE OVERLAY --- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.04"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 1;
        }

        /* --- CUSTOM CURSOR --- */
        #smooth-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
        }

        /* --- TYPOGRAPHY & LAYOUT --- */
        .container {
            max-width: 1200px;
            animation: fadeIn 1s ease-out;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        /* Blinking Terminal Caret */
        .caret {
            display: inline-block;
            width: 4px;
            height: 0.9em;
            background: #fff;
            vertical-align: baseline;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .divider {
            height: 4px;
            width: 80px;
            background: #fff;
            margin: 0 auto 2rem;
        }

        p {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 400;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-fx"></div>
    <div id="smooth-cursor"></div>
    
    <div class="container">
        <h1>Getting<br>Back Soon<span class="caret"></span></h1>
        <div class="divider"></div>
        <p>System Maintenance in Progress</p>
    </div>

    <script>
        // Init Supabase Connection
        const _supabase = supabase.createClient(
            'https://unjdjduiqtldgoybgmnq.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVuamRqZHVpcXRsZGdveWJnbW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MzgzODEsImV4cCI6MjA5MzAxNDM4MX0.qMuQcBysiKuFD5ByoL17fs0KxClgI-FEyzyKYayNVdE'
        );

        // --- Custom Cursor Tracking ---
        const cursor = document.getElementById('smooth-cursor');
        let curX = innerWidth / 2;
        let curY = innerHeight / 2;
        let tgX = curX;
        let tgY = curY;

        window.addEventListener('mousemove', e => {
            tgX = e.clientX;
            tgY = e.clientY;
        });

        function anim() {
            curX += (tgX - curX) * 0.15;
            curY += (tgY - curY) * 0.15;
            cursor.style.left = curX + 'px';
            cursor.style.top = curY + 'px';
            requestAnimationFrame(anim);
        }
        anim();

        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
            });
        });

        // --- Access Verification Logic ---
        async function verifyMaintenanceAccess() {
            try {
                // Fetch current maintenance status
                const { data: settings } = await _supabase.from('settings').select('maintenance_mode').eq('id', 1).single();
                const { data: { session } } = await _supabase.auth.getSession();
                
                let isBlacklisted = false;
                let isAdmin = false;

                // Check user roles if logged in
                if (session) {
                    const { data: profile } = await _supabase.from('users').select('rank, isBlacklisted').eq('id', session.user.id).single();
                    isBlacklisted = (profile?.isBlacklisted === 'true');
                    isAdmin = (profile?.rank === 'admin');
                }

                // If maintenance is OFF, and user isn't blacklisted or an admin, redirect them out
                if (!settings?.maintenance_mode && !isBlacklisted && !isAdmin) {
                    return window.location.href = 'dashboard.html';
                }

                // Show page if they are allowed to be here (Admin, or Maintenance is active)
                document.body.classList.add('ready');

            } catch (error) {
                console.error("Verification failed:", error);
                document.body.classList.add('ready'); // Fail open to avoid blank screen
            }
        }

        verifyMaintenanceAccess();
    </script>
</body>
</html>
