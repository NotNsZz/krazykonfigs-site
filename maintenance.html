<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrazyKonfigs | Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a; /* Deep black matching admin panel */
            color: #ffffff;
            font-family: 'Source Sans Pro', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        .divider {
            height: 4px;
            width: 80px;
            background-color: #ffffff;
            margin: 0 auto 2rem auto;
        }

        p {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 400;
            color: #888888;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Subtle animated grain overlay for texture */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.04"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Getting<br>Back Soon.</h1>
        <div class="divider"></div>
        <p>System Maintenance in Progress</p>
    </div>

</body>
</html>
